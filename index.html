<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>مَشهد — محرر الفيديو</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt=""><b>مَشهد</b></div>
  <div class="top-actions">
    <select id="aspect" title="مقاس الفيديو">
      <option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option>
    </select>
    <button id="undo" class="icon" title="تراجع">↶</button>
    <button id="redo" class="icon" title="إعادة">↷</button>
    <button id="exportBtn" class="primary">تصدير</button>
  </div>
</header>

<main class="stage">
  <div class="preview-wrap"><canvas id="preview" width="720" height="1280"></canvas>
    <div id="empty" class="empty">ابدأ بإضافة فيديو أو صورة<br><button class="primary" id="emptyAdd">＋ استيراد</button></div>
  </div>
</main>

<div class="transport">
  <span id="tcur">00:00.0</span>
  <button id="play" class="play" title="تشغيل">▶</button>
  <span id="tdur">00:00.0</span>
</div>

<section class="timeline-wrap">
  <div class="tl-tools">
    <button data-act="split" title="قص عند المؤشر">✂ تقسيم</button>
    <button data-act="dup">⧉ نسخ</button>
    <button data-act="left">⇠ للأمام</button>
    <button data-act="right">للخلف ⇢</button>
    <button data-act="del" class="danger">🗑 حذف</button>
    <label class="zoom">🔍<input type="range" id="zoom" min="20" max="200" value="60"></label>
  </div>
  <div id="timeline" class="timeline" dir="ltr">
    <div id="ruler" class="ruler"></div>
    <div class="track" id="trk-video"><span class="tlabel">فيديو</span></div>
    <div class="track" id="trk-overlay"><span class="tlabel">نص/ملصق</span></div>
    <div class="track" id="trk-audio"><span class="tlabel">صوت</span></div>
    <div id="playhead" class="playhead"></div>
  </div>
</section>

<section id="panel" class="panel"></section>

<nav class="tabs">
  <button data-tab="media">🎞️<span>وسائط</span></button>
  <button data-tab="text">🅣<span>نص</span></button>
  <button data-tab="sticker">😀<span>ملصقات</span></button>
  <button data-tab="filter">🎨<span>فلاتر</span></button>
  <button data-tab="speed">⏩<span>سرعة</span></button>
  <button data-tab="trans">◐<span>انتقال</span></button>
  <button data-tab="audio">🎵<span>صوت</span></button>
  <button data-tab="project">📁<span>المشروع</span></button>
</nav>

<input type="file" id="fileIn" accept="video/*,image/*,audio/*" multiple hidden>
<input type="file" id="audioIn" accept="audio/*,video/*" hidden>

<div id="exportDlg" class="dlg" hidden><div class="dlg-box">
  <h3>تصدير الفيديو</h3>
  <p id="exFmt"></p>
  <label>الجودة <select id="exQ"><option value="720">720p</option><option value="1080">1080p</option><option value="480">480p</option></select></label>
  <div class="bar"><i id="exBar"></i></div><p id="exMsg"></p>
  <div class="row"><button id="exGo" class="primary">ابدأ التصدير</button><button id="exClose">إغلاق</button></div>
  <a id="exLink" hidden class="primary btnlink">⬇ تنزيل الفيديو</a>
</div></div>
<div id="toast" class="toast"></div>
<footer class="foot">© 2026 وطن النهار / Ahmadalfayed — جميع الحقوق محفوظة</footer>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body></html>
